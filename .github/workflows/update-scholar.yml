name: Update Google Scholar Metrics

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest Google Scholar Metrics
        run: python scripts/update_scholar_metrics.py

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scholar-metrics.json data/publications.json js/publications-data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Google Scholar metrics and publications dataset [skip ci]" && git push)
